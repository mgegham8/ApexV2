name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-issue-stale: 30
          days-before-issue-close: 14

          days-before-pr-stale: 30
          days-before-pr-close: 14

          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed after 14 days if no
            further activity occurs.

          close-issue-message: >
            This issue has been automatically closed due to inactivity.

          stale-pr-message: >
            This pull request has been automatically marked as stale due to
            inactivity. Please update it or comment if it is still in progress.

          close-pr-message: >
            This pull request has been automatically closed due to inactivity.

          exempt-issue-labels: security,critical,bug,audit,p0
          exempt-pr-labels: security,critical,audit,p0